<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Book pages -->
  <g>
    <!-- Left page -->
    <path d="M 20 20 L 45 20 L 45 75 L 20 75 Z" fill="#2563eb" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M 45 20 L 70 20 L 70 75 L 45 75 Z" fill="#3b82f6" stroke="#1e40af" stroke-width="2" stroke-linejoin="round"/>
    <!-- Book spine -->
    <line x1="45" y1="20" x2="45" y2="75" stroke="#0c2540" stroke-width="1.5"/>
    
    <!-- Page lines - Left -->
    <line x1="25" y1="30" x2="40" y2="30" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="25" y1="36" x2="40" y2="36" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="42" x2="40" y2="42" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="48" x2="40" y2="48" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="54" x2="40" y2="54" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="60" x2="40" y2="60" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="66" x2="40" y2="66" stroke="white" stroke-width="1" opacity="0.6"/>
    
    <!-- Page lines - Right -->
    <line x1="50" y1="30" x2="65" y2="30" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="36" x2="65" y2="36" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="42" x2="65" y2="42" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="48" x2="65" y2="48" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="54" x2="65" y2="54" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="60" x2="65" y2="60" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="50" y1="66" x2="65" y2="66" stroke="white" stroke-width="1" opacity="0.7"/>
    
    <!-- Magnifying glass -->
    <circle cx="72" cy="50" r="14" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="83" y1="61" x2="90" y2="68" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Magnifying glass shine -->
    <circle cx="67" cy="45" r="3" fill="white" opacity="0.6"/>
  </g>
</svg>